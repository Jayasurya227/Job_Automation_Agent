# ==============================================================================
# Autonomous AI Job Application Agent - Multi-User Production Stack
# Enterprise Multi-Tenant Architecture (FastAPI + Playwright + React + Nginx)
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: job-agent-backend:latest
    container_name: job_agent_backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:////app/data/jobs.db
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    volumes:
      # Persistent SQLite database, multi-tenant user storage vaults, and browser cookies
      - ./backend/data:/app/data
      # Output snapshots, generated tailored resumes, and application proofs
      - ./backend/output:/app/output
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # Chromium Shared Memory allocation: Prevents /dev/shm OOM crashes on heavy SPAs
    shm_size: "2gb"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - job_agent_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: job-agent-frontend:latest
    container_name: job_agent_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - job_agent_network

networks:
  job_agent_network:
    name: job_agent_network
    driver: bridge
