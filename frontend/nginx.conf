# ==============================================================================
# Autonomous AI Job Application Agent - Nginx Production Configuration
# High-Performance Reverse Proxy & Single-Page Application (SPA) Web Server
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format optimized for low latency & latency tracking
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance Tuning & TCP Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Multi-tenant PDF resume upload limit (50MB)
    client_max_body_size 50M;

    # Gzip Compression Engine
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Upstream Backend Microservice Definition
    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Hardened Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Healthcheck endpoint for Docker Orchestrator
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'OK';
        }

        # ----------------------------------------------------------------------
        # Real-Time SSE (Server-Sent Events) Live Stream Proxy
        # Zero-Buffering & Keep-Alive for /api/events/stream
        # ----------------------------------------------------------------------
        location = /api/events/stream {
            proxy_pass http://backend_upstream/api/events/stream;
            proxy_http_version 1.1;

            # Mandatory SSE Settings
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable all proxy buffering and cache layers
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Long-running timeouts for persistent event streams
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ----------------------------------------------------------------------
        # Backend API Gateway Proxy
        # ----------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # Static Media & Generated Artefacts Gateway (/output/)
        # ----------------------------------------------------------------------
        location /output/ {
            proxy_pass http://backend_upstream/output/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # Immutable Frontend Assets Caching (/assets/)
        # ----------------------------------------------------------------------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # Single-Page Application (SPA) HTML5 Fallback
        # ----------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
